format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

# Flutter is installed through Bitrise's built-in mise integration (the `tools` field),
# which puts `flutter` and `dart` on $PATH for every step in the build.
# Pinned to 3.7.1 because Flutter 3.10 brings Dart 3.0, which the sample app is not compatible with yet.
# (This also exercises the Step's pre-3.10 --machine fallback path end to end.)
tools:
  flutter: 3.7.1

app:
  envs:
  - SAMPLE_APP_URL: https://github.com/bitrise-io/Bitrise-Flutter-Sample.git
  - SAMPLE_APP_BRANCH: main
  - ORIGIN_SOURCE_DIR: $BITRISE_SOURCE_DIR
  - PROJECT_LOCATION: $BITRISE_SOURCE_DIR/_tmp
  - GENERATE_CODE_COVERAGE_FILES: "no"

workflows:
  test_without_codecoverage:
    title: Run without code coverage
    after_run:
    - _common

  test_with_codecoverage:
    envs:
    - GENERATE_CODE_COVERAGE_FILES: "yes"
    title: Run with code coverage
    after_run:
    - _common

  test_not_root_project_with_codecoverage:
    envs:
    - SAMPLE_APP_BRANCH: e2e-test-src-subfolder
    - PROJECT_LOCATION: $ORIGIN_SOURCE_DIR/_tmp/src
    - GENERATE_CODE_COVERAGE_FILES: "yes"
    title: Run with code coverage for not root project
    after_run:
    - _common

  # Exercises the modern --file-reporter path (Flutter >= 3.10). The shared sample app
  # is pinned to Dart < 3.0, so this workflow uses the sample's `dart-3` branch and
  # overrides the Flutter version to 3.10+ via workflow-level `tools`, reusing _common.
  test_file_reporter_flutter_3_10_plus:
    envs:
    - SAMPLE_APP_BRANCH: dart-3
    title: Run on Flutter 3.10+ (human-readable --file-reporter path)
    tools:
      flutter: 3.32.1
    after_run:
    - _common
    steps:
    - script:
        title: Assert this Flutter supports --file-reporter
        description: |-
          Guards the purpose of this workflow: if the `tools` override did not apply
          (or a future Flutter drops the flag), the Step would silently fall back to
          the legacy --machine path and this workflow would pass without covering it.
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            flutter test --help | grep -q -- '--file-reporter'

  _common:
    after_run:
    - _assert_output
    - _validate_coverage
    title: Prepare test
    steps:
    - script:
        title: Delete _tmp
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            cd ${ORIGIN_SOURCE_DIR}
            rm -rf "./_tmp"
            mkdir "_tmp"
    - change-workdir:
        title: Switch working dir to test / _tmp dir
        description: |-
          To prevent step testing issues, like referencing relative
          files with just './some-file' in the step's code, which would
          work for testing the step from this directory directly
          but would break if the step is included in another `bitrise.yml`.
        inputs:
        - path: ${ORIGIN_SOURCE_DIR}/_tmp
        - is_create_path: true
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        title: Clone test project
        inputs:
        - clone_into_dir: $BITRISE_SOURCE_DIR
        - repository_url: $SAMPLE_APP_URL
        - branch: $SAMPLE_APP_BRANCH
    - path::./:
        title: Execute step
        inputs:
        - project_location: $PROJECT_LOCATION
        - generate_code_coverage_files: $GENERATE_CODE_COVERAGE_FILES

  _assert_output:
    steps:
    - script:
        title: Check for JUNIT output
        inputs:
        - content: |-
            #!/bin/bash
            set -ex

            echo "Checking for JUNIT output"
            if ls $BITRISE_TEST_RESULT_DIR/../*/Flutter\ test\ results/flutter_junit_test_results.xml 1> /dev/null 2>&1; then
              echo "JUNIT data exists."
            else
              echo "JUNIT data does not exist."
              exit 1
            fi

            echo "Checking for json test report data at $BITRISE_FLUTTER_TESTRESULT_PATH"
            if [ -s "$BITRISE_FLUTTER_TESTRESULT_PATH" ]; then
              echo "JSON report data exists and is non-empty."
            else
              echo "JSON report data is missing or empty."
              exit 1
            fi

  _validate_coverage:
    steps:
    - script:
        run_if: |-
          {{ enveq "GENERATE_CODE_COVERAGE_FILES" "yes" }}
        title: Check for coverage output
        inputs:
        - content: |-
            #!/bin/bash
            set -ex

            echo "Checking for coverage data at $BITRISE_FLUTTER_COVERAGE_PATH"
            if [ -f "$BITRISE_FLUTTER_COVERAGE_PATH" ]; then
              echo "Coverage data exists."
            else
              echo "Coverage data does not exist as expected."
              exit 1
            fi
